# Kingdom Age screensaver feeds (shipped defaults).
# One http(s) URL per line. Lines starting with # are comments.
#
# Config rule: if ~/.config/omarchy/screensaver-feeds.conf exists and lists
# at least one URL, that file replaces this list. Otherwise these defaults
# are used. Copy this file there to keep the wizwam feeds and add more:
#
#   cp ~/.config/omarchy/themes/kingdom-age/rss-feeds.conf \
#      ~/.config/omarchy/screensaver-feeds.conf
#
# Any public RSS or Atom feed works. yahvehyireh.com has no native RSS;
# those verses are published at wizwam.com/quotes/rss.

https://wizwam.com/quotes/rss
https://wizwam.com/news/rss
